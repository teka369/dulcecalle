# Local PostgreSQL 16 for the Nest backend. Does not touch the PWA / Dexie.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dulcecalle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dulcecalle
      POSTGRES_PASSWORD: dulcecalle
      POSTGRES_DB: dulcecalle
    ports:
      - "5432:5432"
    volumes:
      - dulcecalle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dulcecalle -d dulcecalle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dulcecalle_pg:

name: offline-e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dulcecalle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dulcecalle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dulcecalle_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dulcecalle_test
      JWT_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      NODE_ENV: test
      DISABLE_THROTTLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy
      - name: E2E against PostgreSQL
        working-directory: backend
        run: npx jest --runInBand --forceExit test/offline-close.e2e-spec.ts

  client-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dulcecalle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dulcecalle_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dulcecalle_test
      JWT_SECRET: test-access-secret
      JWT_REFRESH_SECRET: test-refresh-secret
      NODE_ENV: test
      DISABLE_THROTTLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install frontend
        run: npm ci
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: Client data layer against PostgreSQL
        run: npx vitest run --config vitest.client-pg.config.ts
